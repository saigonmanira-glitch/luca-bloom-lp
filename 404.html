<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ページが見つかりません｜Luca Bloom</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161A29">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--navy:#161A29;--navy-line:#2E3550;--ivory:#F5F3EE;--white:#FFFFFF;--ink:#1A1E2C;--muted:#686D7D;--on-navy:#EEF0F6;--on-navy-muted:#A3AAC0;--silver:#C3CADB;--gold:#E3B34E;--line:#E3E0D8;
--font-jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;--font-en:"Avenir Next","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--ivory);color:var(--ink);font-family:var(--font-jp);font-size:16px;line-height:1.85;letter-spacing:.03em}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding-inline:20px;width:100%}
.nb{display:inline-block}
.skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--gold);color:var(--navy);font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;text-decoration:none}
.skip:focus-visible{left:8px;top:8px}
header{background:var(--navy);padding-block:16px}
.logo{font-family:var(--font-en);font-weight:600;font-size:22px;letter-spacing:.06em;color:var(--silver);text-decoration:none}
main{flex:1;padding-block:48px 56px}
.code{font-family:var(--font-en);font-weight:700;font-size:56px;line-height:1;color:#8A6010;margin:0}
h1{font-size:22px;font-weight:900;line-height:1.5;margin:14px 0 8px}
p{margin:0 0 24px;color:#3E4352;font-size:15px}
.links{display:grid;gap:10px}
.links a{display:block;position:relative;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 46px 16px 18px;text-decoration:none;font-weight:700}
.links a::after{content:"";position:absolute;right:20px;top:50%;width:9px;height:9px;margin-top:-5px;border-right:2.5px solid var(--gold);border-top:2.5px solid var(--gold);transform:rotate(45deg)}
.links a.primary{background:var(--navy);color:var(--white);border-color:var(--navy)}
footer{background:var(--navy);color:var(--on-navy-muted);font-size:12px;padding-block:20px}
</style>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<header><div class="wrap"><a class="logo" href="/">Luca Bloom</a></div></header>
<main id="main">
  <div class="wrap">
    <p class="code">404</p>
    <h1>お探しのページが<span class="nb">見つかりません</span></h1>
    <p>URLが変更されたか、ページが削除された可能性があります。下のリンクから目的のページをお探しください。</p>
    <nav class="links" aria-label="主なページ">
      <a class="primary" href="/">トップページ</a>
      <a href="/jp/">ご使用マニュアル・免責事項</a>
      <a href="/column/">コラム</a>
    </nav>
  </div>
</main>
<footer><div class="wrap">© Luca Bloom</div></footer>
</body>
</html>
