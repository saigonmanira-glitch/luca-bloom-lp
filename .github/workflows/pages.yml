# 公開：push のたびに、サイトに必要なファイルだけを集めて GitHub Pages に公開する。
# 制作用のファイル（tools/・tests/・src/・SNS の原稿や指示文・README など）はサイトに出さない（tools/build-site.mjs の許可リスト）。
# リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にすると有効になる。
name: 公開（GitHub Pages）
on:
  push:
    branches: [claude/keen-pascal-bs4hhf]
  workflow_dispatch:
# 最小権限：リポジトリは読むだけ。Pages への公開と、その本人確認（OIDC）だけ許可する
permissions:
  contents: read
  pages: write
  id-token: write
# 公開は1本ずつ。途中の公開は打ち切らない（中途半端な状態を出さない）
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 外部の部品はバージョン名ではなくコミットID（書き換え不可）で固定する
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: 公開するファイルだけを _site に集める
        run: node tools/build-site.mjs
      - name: 集めたファイルにリンク切れ・参照切れがないか
        run: node tools/check-site.mjs
        env:
          SITE_ROOT: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
