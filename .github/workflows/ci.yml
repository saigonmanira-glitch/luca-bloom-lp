# 自動チェック：push のたびに、文法・リンク・ビルド結果・ブラウザでの動作を確認する
name: CI
on:
  # SNS の画像・原稿だけの更新（毎日の自動投稿）では実行しない（非公開リポジトリの無料枠：月2,000分を節約）
  push:
    paths-ignore: ['sns/**', '**/*.md']
  pull_request:
# 最小権限：リポジトリの読み取りのみ（万一ビルド中に不正なコードが動いても、書き込み・公開はできない）
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04 # ubuntu-latest は 2026-10-19 から Ubuntu 26 に切り替わるため、検証済みの版に固定
    timeout-minutes: 30
    steps:
      # 外部の部品はバージョン名ではなくコミットID（書き換え不可）で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 依存パッケージの既知の脆弱性チェック
        run: npm audit --audit-level=moderate
      - name: 配信・事前登録の Worker のテスト（worker/）
        working-directory: worker
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
      - name: 文法チェック（ESLint・HTML）
        run: npm run lint
      - name: リンク・メタ情報・sitemap・CSP のチェック
        run: npm run check
      - name: ビルド結果が src/ と一致しているか
        run: |
          npm run build:js
          git diff --exit-code -- assets/js
      - name: ブラウザ（Chromium）の準備
        run: npx playwright install --with-deps chromium
      - name: 公開するファイルだけを集める（公開と同じ手順。tools/build-site.mjs）
        run: node tools/build-site.mjs
      - name: 集めたファイルにリンク切れ・参照切れがないか
        run: node tools/check-site.mjs
        env:
          SITE_ROOT: _site
      # テストするのは、実際に公開されるファイルそのもの（集め漏れがあれば、ここで失敗する）
      - name: ブラウザでの動作テスト
        run: npm test
        env:
          SITE_ROOT: _site
