name: dns-check
on:
  push:
    paths: ['.github/workflows/dns-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          set +e
          echo "### TLD delegation"; dig +norec NS luca-bloom.com @a.gtld-servers.net
          for ns in bonnie.ns.cloudflare.com rohin.ns.cloudflare.com; do
            for t in SOA A; do echo "### $t @$ns"; dig +norec $t luca-bloom.com @$ns; done
            echo "### www @$ns"; dig +norec www.luca-bloom.com @$ns
          done
          for r in 8.8.8.8 1.1.1.1 9.9.9.9; do echo "### A @$r"; dig luca-bloom.com A @$r | grep -E 'status|IN\s+(A|SOA)'; echo "### www @$r"; dig www.luca-bloom.com @$r | grep -E 'status|IN\s+(A|CNAME)'; done
          echo "### trace"; dig +trace luca-bloom.com A | tail -25
          echo "### http"; curl -sSI -m 15 http://luca-bloom.com | head -5
      - name: Pages
        env: { GH: '${{ github.token }}' }
        run: |
          set +e
          curl -sS -H "Authorization: Bearer $GH" https://api.github.com/repos/${{ github.repository }}/pages
          curl -sS -H "Authorization: Bearer $GH" https://api.github.com/repos/${{ github.repository }}/pages/health
