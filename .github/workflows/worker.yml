# 北米の事前登録フォームの受け口（worker/）を Cloudflare Workers に公開する。
# 必要な秘密情報（リポジトリの Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN …… Cloudflare の API トークン（Workers スクリプト・D1・Workers ルートの編集権限）
#   CLOUDFLARE_ACCOUNT_ID …… Cloudflare のアカウント ID
# どちらも未登録の間は、テストだけ行い公開はしない。
name: 事前登録フォーム（Cloudflare Workers）
on:
  push:
    branches: [claude/keen-pascal-bs4hhf]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: npm ci
      - name: テスト
        run: npm test
      - name: 秘密情報が未登録なら、ここで終了
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::Cloudflare の秘密情報が未登録のため、公開は行いません"; fi
      - name: データベース（D1）を用意する
        if: steps.ready.outputs.ok == '1'
        run: node scripts/ensure-d1.mjs
      - name: データベースの表を最新にする
        if: steps.ready.outputs.ok == '1'
        run: npx wrangler d1 migrations apply luca-bloom-waitlist --remote
      - name: 公開
        if: steps.ready.outputs.ok == '1'
        run: npx wrangler deploy
